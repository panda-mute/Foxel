name: Build and Push Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
      image_tag:
        description: Docker image tag
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker tags
        id: meta
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "$IMAGE_TAG" ]]; then
            DOCKER_TAGS="ghcr.io/${REPO_LC}:${IMAGE_TAG}"
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            DOCKER_TAGS="ghcr.io/${REPO_LC}:${VERSION}"
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            DOCKER_TAGS="ghcr.io/${REPO_LC}:dev"
          else
            # Other branches get their own tag so main and upstream-sync builds cannot overwrite them.
            BRANCH_TAG=$(echo "${GITHUB_REF#refs/heads/}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g')
            DOCKER_TAGS="ghcr.io/${REPO_LC}:branch-${BRANCH_TAG}"
          fi
          # Only main and release tags move :latest, which users pull by default.
          if [[ $GITHUB_REF == refs/tags/* || ( $GITHUB_REF == refs/heads/main && "$IMAGE_TAG" != "latest" ) ]]; then
            DOCKER_TAGS="${DOCKER_TAGS},ghcr.io/${REPO_LC}:latest"
          fi
          echo "DOCKER_TAGS=${DOCKER_TAGS}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (multi arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
